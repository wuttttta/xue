name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # Optional fixed signing key (repo secrets), so a new build installs over the old one.
      - name: Signing key
        env:
          KS: ${{ secrets.XUE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/xue.jks"
            echo "XUE_KEYSTORE_FILE=$RUNNER_TEMP/xue.jks" >> "$GITHUB_ENV"
            echo "Signing with the fixed key"
          else
            echo "No XUE_KEYSTORE_BASE64 secret: throwaway debug key"
          fi

      - name: Build
        env:
          XUE_KEYSTORE_PASSWORD: ${{ secrets.XUE_KEYSTORE_PASSWORD }}
          XUE_KEY_ALIAS: ${{ secrets.XUE_KEY_ALIAS }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - run: cp app/build/outputs/apk/debug/app-debug.apk xue.apk

      - uses: actions/upload-artifact@v4
        with:
          name: xue-apk
          path: xue.apk

      - name: Publish as the "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag -y || true
          sleep 2
          gh release create latest xue.apk --prerelease --target "$GITHUB_SHA" \
            --title "Latest build (#$GITHUB_RUN_NUMBER)" \
            --notes "Debug build of ${GITHUB_SHA::7}. Install xue.apk on the phone."
