name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # Optional fixed signing key (repo secrets), so a new build installs over the old one.
      - name: Signing key
        env:
          KS: ${{ secrets.XUE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            printf '%s' "$KS" | tr -d ' \r\n\t' | base64 -d > "$RUNNER_TEMP/xue.p12"
            # Size and hash only (not secret), to compare with the keystore on the dev machine.
            echo "keystore: $(wc -c < "$RUNNER_TEMP/xue.p12") bytes, sha256 $(sha256sum "$RUNNER_TEMP/xue.p12" | cut -c1-16)"
            echo "secret length: ${#KS} characters"
            echo "XUE_KEYSTORE_FILE=$RUNNER_TEMP/xue.p12" >> "$GITHUB_ENV"
            echo "Signing with the fixed key"
          else
            echo "No XUE_KEYSTORE_BASE64 secret: throwaway debug key"
          fi

      - name: Build
        env:
          XUE_KEYSTORE_PASSWORD: ${{ secrets.XUE_KEYSTORE_PASSWORD }}
          XUE_KEY_ALIAS: ${{ secrets.XUE_KEY_ALIAS }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - run: cp app/build/outputs/apk/debug/app-debug.apk xue.apk

      - uses: actions/upload-artifact@v4
        with:
          name: xue-apk
          path: xue.apk

      # One release per build, tag v0.1.<run>: Obtainium tracks releases by tag, and
      # /releases/latest/download/xue.apk always points at the newest one.
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v0.1.$GITHUB_RUN_NUMBER" xue.apk --target "$GITHUB_SHA" \
            --title "0.1.$GITHUB_RUN_NUMBER" \
            --notes "Debug build of ${GITHUB_SHA::7}. Install xue.apk on the phone."

      - name: Tell Obtainium about the release
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          OBTAINIUM_PUSH_URL: ${{ secrets.OBTAINIUM_PUSH_URL }}
        run: |
          [ -n "$OBTAINIUM_PUSH_URL" ] || exit 0
          curl -fsS -d "https://github.com/${{ github.repository }}" "$OBTAINIUM_PUSH_URL"
